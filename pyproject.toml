[project]
name = "telegram-mcp"
version = "0.1.0"
description = "A local MCP server that lets Claude Code use your own Telegram account, asking you before every action that changes anything."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telethon==1.45.0",
    "mcp==2.3.0",
    "keyring==25.7.0",
]

[project.scripts]
telegram-mcp = "telegram_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "S603",  # subprocess calls take fixed argument lists, never a shell
    "S607",  # uv and other tools are found on PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks
    "S105",  # fake secret values are generated per test run
    "S106",
    "S108",  # tests use short folders under /tmp for the socket path limit
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["telegram_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
