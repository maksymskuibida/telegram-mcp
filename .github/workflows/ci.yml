name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    # The tool supports macOS only (Keychain, flock and Unix-socket behaviour are tested here).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the full history (the secret scan reads every commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy --strict src tests scripts

      - name: Tests with coverage (90% floor)
        run: uv run pytest --cov=telegram_mcp --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: constraints.txt and the == pins match uv.lock
        run: uv run python scripts/check_constraints.py

      - name: Audit the dependencies users install
        run: uv run pip-audit -r constraints.txt --disable-pip --no-deps

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Scan the full history for secrets
        run: gitleaks git --redact --no-banner --verbose .
